[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cxx-sca-v2"
version = "0.11.0"
description = "Component-context C/C++ source SCA with strict fingerprint-required identity"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cxx-sca = "cxxsca.cli:main"
cxx-sca-build-index = "cxxsca.index_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cxxsca*", "checkers*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
